<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | LCKY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050a07;
            --bg-card: #0d1f15;
            --primary: #00ff88;
            --secondary: #00cc6a;
            --text-main: #ffffff;
            --text-muted: #a0bfb0;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        .header {
            background: rgba(5, 10, 7, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo span { color: var(--primary); }

        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--primary); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .leaderboard-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 12px 30px;
            background: transparent;
            border: 2px solid rgba(0, 255, 136, 0.3);
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
        }
        .tab-btn:hover, .tab-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .leaderboard-container {
            background: var(--bg-card);
            border: 2px solid rgba(0, 255, 136, 0.1);
            border-radius: 20px;
            overflow: hidden;
        }

        .leaderboard-header {
            display: grid;
            grid-template-columns: 80px 1fr 200px 150px 150px;
            padding: 20px 30px;
            background: rgba(0, 255, 136, 0.05);
            font-weight: 700;
            color: var(--primary);
            border-bottom: 2px solid rgba(0, 255, 136, 0.2);
        }
        @media (max-width: 768px) {
            .leaderboard-header {
                grid-template-columns: 60px 1fr 120px;
                font-size: 0.85rem;
            }
        }

        .leaderboard-row {
            display: grid;
            grid-template-columns: 80px 1fr 200px 150px 150px;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s;
            cursor: pointer;
        }
        .leaderboard-row:hover {
            background: rgba(0, 255, 136, 0.05);
        }
        .leaderboard-row:last-child {
            border-bottom: none;
        }
        @media (max-width: 768px) {
            .leaderboard-row {
                grid-template-columns: 60px 1fr 120px;
                padding: 15px 20px;
                font-size: 0.9rem;
            }
            .hide-mobile { display: none; }
        }

        .rank {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .rank.gold { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .rank.silver { color: var(--silver); text-shadow: 0 0 10px var(--silver); }
        .rank.bronze { color: var(--bronze); text-shadow: 0 0 10px var(--bronze); }
        .rank.normal { color: var(--text-muted); }

        .member-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .member-avatar-small {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .member-details {
            display: flex;
            flex-direction: column;
        }
        .member-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .member-role-small {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--primary);
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">LCKY<span>.GG</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="members.html">Members</a>
                <a href="leaderboard.html" style="color: var(--primary);">Leaderboard</a>
                <a href="apply.html">Apply</a>
                <a href="https://discord.gg/lcky" target="_blank">Discord</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>🏆 Leaderboard</h1>
            <p>Zero Skill. All Luck. Who's on top?</p>
        </div>

        <div class="leaderboard-tabs">
            <button class="tab-btn active" onclick="showLeaderboard('power')"> By Power</button>
            <button class="tab-btn" onclick="showLeaderboard('kills')">⚔️ By Kills</button>
            <button class="tab-btn" onclick="showLeaderboard('lucky')">🍀 Lucky Points</button>
        </div>

        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <div>Rank</div>
                <div>Member</div>
                <div class="hide-mobile">Role</div>
                <div>Power</div>
                <div class="hide-mobile">Lucky Points</div>
            </div>
            <div id="leaderboardBody">
                <!-- Leaderboard rows loaded here -->
            </div>
        </div>

        <div class="no-data" id="noData" style="display: none;">
            No data available yet.
        </div>
    </div>

    <script src="data/members.js"></script>
    <script>
        let currentLeaderboard = 'power';

        function showLeaderboard(type) {
            currentLeaderboard = type;
            
            // Update active tab
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const body = document.getElementById('leaderboardBody');
            const noData = document.getElementById('noData');
            body.innerHTML = '';

            // Sort members
            let sortedMembers = [...members].filter(m => m.status === 'approved' || m.status === 'founder');
            
            if (type === 'power') {
                sortedMembers.sort((a, b) => (b.power || 0) - (a.power || 0));
            } else if (type === 'kills') {
                sortedMembers.sort((a, b) => (b.unitsKilled || 0) - (a.unitsKilled || 0));
            } else if (type === 'lucky') {
                sortedMembers.sort((a, b) => (b.luckyPoints || 0) - (a.luckyPoints || 0));
            }

            if (sortedMembers.length === 0) {
                noData.style.display = 'block';
                return;
            }
            noData.style.display = 'none';

            sortedMembers.forEach((member, index) => {
                const rank = index + 1;
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                row.onclick = () => window.location.href = `profile.html?user=${member.username}`;

                let rankClass = 'normal';
                let rankDisplay = rank;
                if (rank === 1) { rankClass = 'gold'; rankDisplay = ''; }
                else if (rank === 2) { rankClass = 'silver'; rankDisplay = '🥈'; }
                else if (rank === 3) { rankClass = 'bronze'; rankDisplay = '🥉'; }

                let statValue;
                if (type === 'power') {
                    statValue = (member.power || 0) / 1000000;
                    statValue = statValue.toFixed(2) + 'M';
                } else if (type === 'kills') {
                    statValue = (member.unitsKilled || 0) / 1000000;
                    statValue = statValue.toFixed(2) + 'M';
                } else {
                    statValue = member.luckyPoints || 0;
                }

                row.innerHTML = `
                    <div class="rank ${rankClass}">${rankDisplay}</div>
                    <div class="member-info">
                        <div class="member-avatar-small">${member.avatar}</div>
                        <div class="member-details">
                            <div class="member-name">${member.username}</div>
                            <div class="member-role-small">${member.role}</div>
                        </div>
                    </div>
                    <div class="hide-mobile">${member.role}</div>
                    <div class="stat-value">${type === 'lucky' ? '-' : statValue}</div>
                    <div class="stat-value hide-mobile">${type === 'lucky' ? statValue : member.luckyPoints}</div>
                `;

                body.appendChild(row);
            });
        }

        // Load default leaderboard
        showLeaderboard('power');
    </script>
</body>
</html>
