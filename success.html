<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCKY | Application Sent!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background: #050505; color: #ffffff;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 2rem; position: relative; overflow: hidden;
        }
        body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.08) 0%, transparent 60%); pointer-events: none; z-index: 0; }
        :root { --neon-green: #39ff14; --neon-yellow: #fff700; }
        .success-container { position: relative; z-index: 2; max-width: 600px; width: 100%; animation: fadeInUp 0.8s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .check-icon {
            width: 100px; height: 100px; margin: 0 auto 2rem; border: 3px solid var(--neon-green); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; animation: pulseCheck 2s infinite;
        }
        @keyframes pulseCheck { 0%, 100% { box-shadow: 0 0 30px rgba(57, 255, 20, 0.3); } 50% { box-shadow: 0 0 60px rgba(57, 255, 20, 0.7); } }
        .check-icon svg { width: 50px; height: 50px; stroke: var(--neon-green); filter: drop-shadow(0 0 10px var(--neon-green)); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: clamp(2rem, 6vw, 3rem); font-weight: 900; color: var(--neon-green); text-shadow: 0 0 20px rgba(57, 255, 20, 0.5); margin-bottom: 1rem; letter-spacing: 0.05em; }
        p { font-size: 1.1rem; color: #94a3b8; line-height: 1.7; margin-bottom: 2.5rem; }
        .highlight { color: var(--neon-yellow); font-weight: 600; }
        .home-btn {
            display: inline-block; padding: 1rem 3rem; background: transparent; border: 2px solid var(--neon-green); color: #fff;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.1em;
            text-decoration: none; transition: all 0.3s;
        }
        .home-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 40px rgba(57, 255, 20, 0.8); transform: translateY(-3px); }
        .footer-text { margin-top: 4rem; font-size: 0.85rem; color: #444; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.1em; }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="check-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1>APPLICATION SENT!</h1>
        <p>
            Your migration application has been received by the <span class="highlight">LCKY Council</span>.<br>
            We will review your details and contact you via <span class="highlight">Discord</span> shortly.<br><br>
            Fortune favors the bold. Welcome to the No Skill Nation.
        </p>
        <a href="https://dunirrdev.github.io/lcky/" class="home-btn">Return to Base</a>
    </div>
    <div class="footer-text">Zero Skill All Luck • Tactics are temporary, luck is eternal</div>
</body>
</html>
