<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | LCKY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050a07;
            --bg-card: #0d1f15;
            --primary: #00ff88;
            --secondary: #00cc6a;
            --text-main: #ffffff;
            --text-muted: #a0bfb0;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        .header {
            background: rgba(5, 10, 7, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo span { color: var(--primary); }

        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--primary); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }
        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            padding: 10px 25px;
            background: transparent;
            border: 2px solid rgba(0, 255, 136, 0.3);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
        .filter-btn:hover, .filter-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .member-card {
            background: var(--bg-card);
            border: 2px solid rgba(0, 255, 136, 0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .member-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.2);
        }
        .member-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient);
        }

        .member-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
            border: 3px solid rgba(0, 255, 136, 0.3);
        }

        .member-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .member-role {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--primary);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .member-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 136, 0.1);
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--primary);
            font-weight: 700;
        }
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .badges {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 1.5rem;
            cursor: help;
            transition: transform 0.2s;
        }
        .badge:hover {
            transform: scale(1.3);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }
        .spinner {
            border: 3px solid rgba(0, 255, 136, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-members {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            .members-grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="index.html" class="logo">LCKY<span>.GG</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="members.html" style="color: var(--primary);">Members</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a href="apply.html">Apply</a>
                <a href="https://discord.gg/lcky" target="_blank">Discord</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1> Our Members</h1>
            <p>Zero Skill. All Luck. Meet the LCKY family.</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterMembers('all')">All Members</button>
            <button class="filter-btn" onclick="filterMembers('founder')">Founders</button>
            <button class="filter-btn" onclick="filterMembers('approved')">Approved</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading members...</p>
        </div>

        <div class="members-grid" id="membersGrid" style="display: none;">
            <!-- Members loaded here -->
        </div>

        <div class="no-members" id="noMembers" style="display: none;">
            No members found in this category yet.
        </div>
    </div>

    <script src="data/members.js"></script>
    <script>
        let currentFilter = 'all';

        function displayMembers(filter = 'all') {
            const grid = document.getElementById('membersGrid');
            const noMembers = document.getElementById('noMembers');
            const loading = document.getElementById('loading');
            
            grid.innerHTML = '';

            let filteredMembers = members.filter(m => m.status !== 'pending');
            
            if (filter !== 'all') {
                filteredMembers = filteredMembers.filter(m => m.status === filter);
            }

            if (filteredMembers.length === 0) {
                loading.style.display = 'none';
                noMembers.style.display = 'block';
                return;
            }
            
            loading.style.display = 'none';
            noMembers.style.display = 'none';
            grid.style.display = 'grid';

            filteredMembers.forEach(member => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.onclick = () => window.location.href = `profile.html?user=${encodeURIComponent(member.username)}`;
                
                card.innerHTML = `
                    <div class="member-avatar">${member.avatar || '⚔️'}</div>
                    <h3 class="member-name">${member.username}</h3>
                    <span class="member-role">${member.role}</span>
                    <div class="badges">
                        ${(member.badges || []).map(b => `<span class="badge" title="${b.name}">${b.icon}</span>`).join('')}
                    </div>
                    <div class="member-stats">
                        <div class="stat">
                            <div class="stat-value">${((member.power || 0) / 1000000).toFixed(1)}M</div>
                            <div class="stat-label">Power</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${member.luckyPoints || 0}</div>
                            <div class="stat-label">Lucky Points</div>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        function filterMembers(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayMembers(filter);
        }

        // Carregar quando members.js terminar
        window.addEventListener('membersLoaded', () => {
            displayMembers(currentFilter);
        });

        // Fallback se demorar muito
        setTimeout(() => {
            if (members.length === 0) {
                document.getElementById('loading').innerHTML = '<p style="color: var(--error);">Error loading members. Please refresh.</p>';
            }
        }, 5000);
    </script>
</body>
</html>
