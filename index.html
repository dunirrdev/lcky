<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LCKY | Zero Skill All Luck - Call of Dragons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        
        :root { 
            --lightning-green: #39ff14; 
            --lightning-yellow: #fff700; 
            --fire-orange: #ff6600; 
            --fire-red: #ff3300; 
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.04) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* ANIMATED FIRE LOGO CSS */
        .fire-logo-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fire-logo {
            position: relative;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 30px rgba(255, 102, 0, 0.6));
            animation: logoFloat 3s ease-in-out infinite;
        }
        .fire-svg { width: 100%; height: 100%; }
        .flame {
            fill: url(#fireGradient);
            animation: flamePulse 0.5s ease-in-out infinite alternate;
        }
        .flame-inner {
            fill: url(#innerFireGradient);
            animation: flameFlicker 0.3s ease-in-out infinite alternate;
        }
        .spark {
            fill: #fff700;
            animation: sparkRise 2s ease-out infinite;
        }
        .spark:nth-child(2) { animation-delay: 0.5s; }
        .spark:nth-child(3) { animation-delay: 1s; }
        .spark:nth-child(4) { animation-delay: 1.5s; }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes flamePulse {
            0% { opacity: 0.8; transform: scale(1); filter: brightness(1); }
            100% { opacity: 1; transform: scale(1.05); filter: brightness(1.3); }
        }
        @keyframes flameFlicker {
            0% { opacity: 0.6; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        @keyframes sparkRise {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(0); }
        }
        .fire-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(255, 102, 0, 0.4) 0%, transparent 70%);
            animation: glowPulse 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, var(--lightning-green), var(--lightning-yellow));
            z-index: 100; transition: width 0.1s; box-shadow: 0 0 10px var(--lightning-green);
        }

        .nav {
            position: fixed; top: 0; width: 100%; padding: 1rem; z-index: 50;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
        }

        .nav-brand {
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900;
            color: #fff; text-shadow: 0 0 10px var(--lightning-green); letter-spacing: 2px;
        }

        .mobile-menu-btn { display: none; flex-direction: column; justify-content: space-around; width: 30px; height: 25px; background: transparent; border: none; cursor: pointer; z-index: 60; }
        .mobile-menu-btn span { width: 30px; height: 3px; background: var(--lightning-green); transition: all 0.3s; }
        .mobile-menu-btn.active span:nth-child(1) { transform: rotate(45deg); }
        .mobile-menu-btn.active span:nth-child(2) { opacity: 0; }
        .mobile-menu-btn.active span:nth-child(3) { transform: rotate(-45deg); }
        
        .mobile-menu { position: fixed; top: 0; right: -100%; width: 80%; max-width: 300px; height: 100vh; background: #0a0a0a; z-index: 55; transition: right 0.3s; padding: 6rem 2rem; border-left: 1px solid var(--lightning-green); }
        .mobile-menu.active { right: 0; }
        .mobile-menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 54; opacity: 0; visibility: hidden; transition: 0.3s; }
        .mobile-menu-overlay.active { opacity: 1; visibility: visible; }
        .mobile-menu a { display: block; padding: 1rem 0; color: #fff; text-decoration: none; font-family: 'Rajdhani'; font-size: 1.2rem; border-bottom: 1px solid #222; }

        .hero {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 8rem 1.5rem 4rem; position: relative; z-index: 2;
        }

        .hero-subtitle-group { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; margin-bottom: 2.5rem; }
        .hero-tagline { font-family: 'Rajdhani'; font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; color: var(--lightning-green); text-transform: uppercase; letter-spacing: 0.2em; text-shadow: 0 0 15px rgba(57, 255, 20, 0.4); }
        .hero-nation { font-family: 'Rajdhani'; font-size: clamp(1rem, 2.5vw, 1.4rem); font-weight: 600; color: var(--lightning-yellow); text-transform: uppercase; letter-spacing: 0.15em; }
        .hero-divider { width: 100px; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); opacity: 0.3; }
        
        .hero-description { font-size: 1.1rem; color: #94a3b8; max-width: 600px; line-height: 1.6; margin-bottom: 3rem; }
        
        .hero-btn {
            display: inline-block; padding: 1rem 3rem; background: transparent; color: #fff;
            font-family: 'Rajdhani'; font-weight: 700; font-size: 1.1rem; text-decoration: none;
            border: 1px solid var(--lightning-green); text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.3s;
        }
        .hero-btn:hover { background: var(--lightning-green); color: #000; box-shadow: 0 0 30px rgba(57, 255, 20, 0.6); }

        .scroll-indicator { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); cursor: pointer; opacity: 0.5; animation: bounce 2s infinite; }
        .scroll-indicator.hidden { opacity: 0; pointer-events: none; }
        @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-10px); } }

        .scroll-top-button { position: fixed; bottom: 1.5rem; right: 1.5rem; width: 45px; height: 45px; background: #000; border: 1px solid var(--lightning-green); color: var(--lightning-green); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; z-index: 40; }
        .scroll-top-button.visible { opacity: 1; visibility: visible; }
        .scroll-top-button:hover { background: var(--lightning-green); color: #000; }

        .section { padding: 5rem 1.5rem; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
        .section-title { font-family: 'Orbitron'; font-size: 2rem; color: #fff; border-left: 3px solid var(--lightning-green); padding-left: 1rem; margin-bottom: 0.5rem; }
        .section-subtitle { font-family: 'Rajdhani'; color: var(--lightning-yellow); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3rem; padding-left: 1.2rem; }

        .leadership-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-top: 2rem; }
        .leader-card { background: #0a0a0a; border: 1px solid #222; border-top: 1px solid var(--lightning-green); padding: 1.5rem; transition: 0.3s; }
        .leader-card:hover { transform: translateY(-5px); border-color: var(--lightning-green); box-shadow: 0 5px 20px rgba(57, 255, 20, 0.1); }
        .leader-name { font-family: 'Orbitron'; font-size: 1.2rem; color: #fff; margin-bottom: 0.3rem; }
        .leader-role { font-family: 'Rajdhani'; color: var(--lightning-green); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 0.8rem; }
        .leader-power { color: #666; font-size: 0.85rem; }

        .form-container { background: #0a0a0a; border: 1px solid #222; padding: 2rem; position: relative; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: var(--lightning-yellow); font-family: 'Rajdhani'; font-size: 0.9rem; text-transform: uppercase; }
        .form-input { width: 100%; padding: 0.8rem; background: #000; border: 1px solid #333; color: #fff; font-size: 16px; }
        .form-input:focus { outline: none; border-color: var(--lightning-green); }
        .form-button { width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--lightning-green); color: var(--lightning-green); font-family: 'Rajdhani'; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 1rem; transition: 0.3s; }
        .form-button:hover { background: var(--lightning-green); color: #000; }
        .form-button:disabled { opacity: 0.5; cursor: not-allowed; }

        .success
