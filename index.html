<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LCKY | Zero Skill All Luck - Call of Dragons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        
        :root { 
            --lightning-green: #39ff14; 
            --lightning-yellow: #fff700; 
            --metal-dark: #2a2a2a;
            --gold-aged: #b8860b;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(57, 255, 20, 0.04) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* WAR SHIELD LOGO */
        .war-logo-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .war-logo {
            position: relative;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(184, 134, 11, 0.3));
            animation: idleFloat 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .war-logo svg { width: 100%; height: 100%; }
        .shield-base { fill: url(#shieldGradient); stroke: #1a1a1a; stroke-width: 2; }
        .shield-rim { fill: none; stroke: url(#rimGradient); stroke-width: 3; }
        .clover-engraved { fill: url(#engravedGradient); filter: url(#innerGlow); }
        .clover-engraved-path { fill: none; stroke: url(#engravedGradient); stroke-width: 2; stroke-linecap: round; }
        .dice-metal { fill: url(#diceMetalGradient); stroke: #b8860b; stroke-width: 1; }
        .dice-dot-metal { fill: #fff700; transition: opacity 0.2s; }
        .rivet { fill: url(#rivetGradient); }

        .dice-wrapper {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 10;
            cursor: pointer;
        }
        .dice-wrapper.left { left: 95px; top: 110px; }
        .dice-wrapper.right { left: 175px; top: 110px; }
        .dice-wrapper svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 0 8px rgba(184, 134, 11, 0.6));
        }

        @keyframes orbitLeft {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-80px, -60px) rotate(180deg); }
            50% { transform: translate(-100px, 40px) rotate(360deg); }
            75% { transform: translate(-40px, 80px) rotate(540deg); }
            100% { transform: translate(0, 0) rotate(720deg); }
        }
        @keyframes orbitRight {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(80px, -60px) rotate(-180deg); }
            50% { transform: translate(100px, 40px) rotate(-360deg); }
            75% { transform: translate(40px, 80px) rotate(-540deg); }
            100% { transform: translate(0, 0) rotate(-720deg); }
        }

        .dice-wrapper.orbiting.left { animation: orbitLeft 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .dice-wrapper.orbiting.right { animation: orbitRight 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        .trail-particle {
            position: absolute; width: 6px; height: 6px; border-radius: 50%;
            pointer-events: none; z-index: 5; animation: trailFade 0.8s ease-out forwards;
        }
        @keyframes trailFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .war-logo-container:hover .war-logo {
            animation: hoverShake 0.5s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(57, 255, 20, 0.8)) drop-shadow(0 0 60px rgba(184, 134, 11, 0.5));
        }
        .war-logo-container:hover .clover-engraved { animation: cloverGlow 0.8s ease-in-out infinite alternate; }
        .war-logo-container:hover .shield-base { filter: brightness(1.3); }

        .particle {
            position: absolute; width: 4px; height: 4px; background: #39ff14;
            border-radius: 50%; opacity: 0; pointer-events: none; box-shadow: 0 0 10px #39ff14;
        }

        @keyframes idleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        @keyframes hoverShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-2px, 1px) rotate(-1deg); }
            50% { transform: translate(2px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, 2px) rotate(-0.5deg); }
        }
        @keyframes cloverGlow {
            0% { filter: url(#innerGlow) brightness(1); }
            100% { filter: url(#innerGlow) brightness(1.8) drop-shadow(0 0 15px #39ff14); }
        }
        @keyframes particleExplode {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        .war-glow {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120%; height: 120%;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.3) 0%, rgba(57, 255, 20, 0.15) 40%, transparent 70%);
            animation: warGlowPulse 3s ease-in-out infinite;
            pointer-events: none; transition: all 0.3s ease;
        }
        .war-logo-container:hover .war-glow {
            background: radial-gradient(circle, rgba(57, 255, 20, 0.5) 0%, rgba(184, 134, 11, 0.3) 40%, transparent 80%);
            animation: warGlowPulse 1s ease-in-out infinite;
        }
        @keyframes warGlowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .war-logo-container::after {
            content: 'Click to Roll the Dice';
            position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Rajdhani', sans-serif; font-size: 0.85rem;
            color: #b8860b; text-transform: uppercase; letter-spacing: 0.2em;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap;
        }
        .war-logo-container:hover::after { opacity: 1; }

        .dice-result {
            position: absolute; top: -40px; left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 900;
            color: #fff700; text-shadow: 0 0 15px #b8860b, 0 0 30px #39ff14;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
            white-space: nowrap; z-index: 20;
        }
        .dice-result.show { opacity: 1; animation: resultPop 0.6s ease-out; }
        @keyframes resultPop {
            0% { transform: translateX(-50%) scale(0.3) translateY(20px); opacity: 0; }
            50% { transform: translateX(-50%) scale(1.4) translateY(-10px); opacity: 1; }
            100% { transform: translateX(-50%) scale(1) translateY(0); opacity: 1; }
        }

        .shield-flash {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 247, 0, 0.4) 0%, transparent 60%);
            opacity: 0; pointer-events: none; z-index: 8;
        }
        .shield-flash.active { animation: flashPulse 0.8s ease-out; }
        @keyframes flashPulse {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
        }

        .progress-bar {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, var(--lightning-green), var(--lightning-yellow));
            z-index: 100; transition: width 0.1s; box-shadow: 0 0 10px var(--lightning-green);
        }

        .nav {
            position: fixed; top: 0; width: 100%; padding: 1rem; z-index: 50;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(57, 255, 20, 0.1);
        }

        .nav-brand {
            font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900;
            color: #fff; text-shadow: 0 0 10px var(--lightning-green); letter-spacing: 2px;
        }

        .mobile-menu-btn { display: none; flex-direction: column; justify-content: space-around; width: 30px; height: 25px; background: transparent; border: none; cursor: pointer; z-index: 60; }
        .mobile-menu-btn span { width: 30px; height: 3px; background: var(--lightning-green); transition: all 0.3s; }
        .mobile-menu-btn.active span:nth-child(1) { transform: rotate(45deg); }
        .mobile-menu-btn.active span:nth-child(2) { opacity: 0; }
        .mobile-menu-btn.active span:nth-child(3) { transform: rotate(-45deg); }
        
        .mobile-menu { position: fixed; top: 0; right: -100%; width: 80%; max-width: 300px; height: 100vh; background: #0a0a0a; z-index: 55; transition: right 0.3s; padding: 6rem 2rem; border-left: 1px solid var(--lightning-green); }
        .mobile-menu.active { right: 0; }
        .mobile-menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 54; opacity: 0; visibility: hidden; transition: 0.3s; }
        .mobile-menu-overlay.active { opacity: 1; visibility: visible; }
        .mobile-menu a { display: block; padding: 1rem 0; color: #fff; text-decoration: none; font-family: 'Rajdhani'; font-size: 1.2rem; border-bottom: 1px solid #222; }

        .hero {
            min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 8rem 1.5rem 4rem; position: relative; z-index: 2;
        }

        .hero-subtitle-group { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; margin-bottom: 2.5rem; }
        .hero-tagline { font-family: 'Rajdhani'; font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 700; color: var(--lightning-green); text-transform: uppercase; letter-spacing: 0.2em; text-shadow: 0 0 15px rgba(57, 255, 20, 0.4); }
        .hero-nation { font-family: 'Rajdhani'; font-size: clamp(1rem, 2.5vw, 1.4rem); font-weight: 600; color: var(--lightning-yellow); text-transform: uppercase; letter-spacing: 0.15em; }
        .hero-divider { width: 100px; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); opacity: 0.3; }
        
        .hero-description { font-size: 1.1rem; color
